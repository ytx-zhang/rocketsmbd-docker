# 用法：cp compose.example.yaml compose.yaml，按需改镜像 tag / 挂载路径
services:
  rocketsmbd:
    image: ghcr.io/ytx-zhang/rocketsmbd:latest
    container_name: rocketsmbd
    restart: always

    # host 网络：直接监听宿主机 445，客户端看到真实源地址
    network_mode: host

    volumes:
      # 配置文件单文件挂载到镜像内的固定路径；宿主机文件不存在时 Docker 会建成目录
      - ./rocketsmbd.toml:/etc/rocketsmbd/rocketsmbd.toml:ro
      # 共享目录：宿主机 /mnt → 容器 /mnt，需与 rocketsmbd.toml 里 share 的 path 一致
      - /mnt:/mnt

    # scratch 镜像里没有 /etc/passwd，默认就是 root；
    # root 自带 CAP_NET_BIND_SERVICE + CAP_DAC_OVERRIDE，所以不需要 cap_add。
    # 要降权的话：chown 共享目录后加 user: "1000:1000" 和 cap_add: [NET_BIND_SERVICE]

    # Docker 默认 seccomp 白名单里没有 io_uring_setup，不放开就会报 EPERM 启动失败。
    # 想最小权限：换成 - seccomp:./seccomp-io_uring.json（官方白名单 + 3 个 io_uring syscall，
    # 需与 compose 文件放同一目录）
    security_opt:
      - seccomp:unconfined
